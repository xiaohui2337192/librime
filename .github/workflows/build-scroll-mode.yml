name: Build librime with scroll mode

on:
  push:
    branches: [ scroll-mode ]
  workflow_dispatch:

env:
  BOOST_VERSION: 1.84.0

jobs:
  build:
    runs-on: windows-2022
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Cache Boost
      uses: actions/cache@v4
      id: cache-boost
      with:
        path: ${{ github.workspace }}/boost
        key: ${{ runner.os }}-boost-${{ env.BOOST_VERSION }}
        
    - name: Download Boost
      if: steps.cache-boost.outputs.cache-hit != 'true'
      run: |
        $url = "https://archives.boost.io/release/1.84.0/source/boost_1_84_0.zip"
        Invoke-WebRequest -Uri $url -OutFile boost.zip
        7z x boost.zip -o${{ github.workspace }}/boost -y
        
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
      
    - name: Build librime
      shell: cmd
      run: |
        set BOOST_ROOT=${{ github.workspace }}\boost\boost_1_84_0
        echo BOOST_ROOT=%BOOST_ROOT%
        set RIME_ROOT=%CD%
        mkdir build
        cd build
        cmake .. -G "Visual Studio 17 2022" -A x64 -DBUILD_TEST=OFF -DBUILD_STATIC=ON
        msbuild rime.sln /p:Configuration=Release /m /v:quiet
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: librime-scroll-mode
        path: build/lib/Release/rime.dll
