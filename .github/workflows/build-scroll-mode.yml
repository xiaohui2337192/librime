name: Build librime with scroll mode

on:
  push:
    branches: [ scroll-mode ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2019
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
      
    - name: Install dependencies
      run: |
        choco install boost-msvc-14.2 -y
        choco install ninja -y
        
    - name: Build dependencies
      run: |
        $env:BOOST_ROOT = "C:\Program Files\Boost"
        $env:RIME_ROOT = $PWD
        ./build.bat deps
      continue-on-error: true
        
    - name: Build librime
      run: |
        $env:BOOST_ROOT = "C:\Program Files\Boost"
        $env:RIME_ROOT = $PWD
        ./build.bat librime
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: librime-scroll-mode
        path: |
          build/lib/Release/*.dll
          build/lib/Release/*.lib
          build/bin/Release/*.exe
